[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cspdv"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "mysql-connector-python==9.6.0",
    "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
include = ["database*", "modules*", "utils*"]